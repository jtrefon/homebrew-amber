name: bump

# Wires this tap's formula to each new amber release: reads the darwin
# arm64 tarball checksum from the GitHub Release, patches the pinned version
# and on_arm SHA block in Formula/amber-agent.rb, and commits. Runs on a
# schedule, on demand, and via repository_dispatch from the amber repo's
# release. Apple Silicon only — amber no longer ships Intel macOS tarballs.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch latest release and patch formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh release view latest resolves the literal tag "latest" on newer
          # gh versions (2.100+) and fails with "release not found"; the REST
          # latest endpoint returns the true latest release pointer.
          tag=$(gh api repos/jtrefon/amber/releases/latest --jq .tag_name)
          ver=${tag#v}
          formula=Formula/amber-agent.rb
          tmp=$(mktemp -d)
          gh release download "$tag" \
            --repo jtrefon/amber --dir "$tmp" \
            --pattern 'amber-*-darwin-*.tar.gz.sha256' 2>/dev/null || {
            echo "no darwin checksums on ${tag}; nothing to do"
            exit 0
          }
          shas=$(cat "$tmp"/*.sha256)
          arm=$(echo "$shas" | awk '/darwin-arm64/ {print $1}')
          [ -n "$arm" ] || { echo "missing arm64 checksum"; exit 1; }
          export FORMULA_VERSION="$ver" ARM_SHA="$arm" FORMULA_FILE="$formula"
          ruby -e '
            content = File.read(ENV.fetch("FORMULA_FILE"))
            content.sub!(/version "[^"]*"/, "version \"#{ENV.fetch("FORMULA_VERSION")}\"")
            content.sub!(/on_arm do\n\s*sha256 "[^"]*"/,
                         "on_arm do\n    sha256 \"#{ENV.fetch("ARM_SHA")}\"")
            File.write(ENV.fetch("FORMULA_FILE"), content)
          '
          rm -rf "$tmp"

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet Formula/amber-agent.rb; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/amber-agent.rb
            git commit -m "bump: sync amber formula to latest release"
            git push
          else
            echo "formula already current"
          fi